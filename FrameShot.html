<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>EndFrame - Local Video Tool</title>
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      /* Custom Range Input Styling */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #6366f1;
        cursor: pointer;
        margin-top: -6px;
        box-shadow: 0 0 0 2px #0f172a;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #334155;
        border-radius: 2px;
      }
      input[type=range]:focus::-webkit-slider-thumb {
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.3);
      }
      
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.5s ease-out forwards;
      }
      
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      
      @keyframes slide-in {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .animate-slide-in {
        animation: slide-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>

    <!-- Main Application Code -->
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef, useCallback } from 'react';
      import { createRoot } from 'react-dom/client';
      import { Upload, Video, AlertCircle, Download, ChevronLeft, SkipBack, ChevronRight, SkipForward, Play, Film } from 'lucide-react';

      // --- Types (Simulated) ---
      const AppState = {
        IDLE: 'IDLE',
        PROCESSING: 'PROCESSING',
        EDITOR: 'EDITOR',
        ERROR: 'ERROR'
      };

      // --- Components/Button.tsx ---
      const Button = ({ 
        children, 
        variant = 'primary', 
        isLoading = false, 
        icon,
        className = '',
        disabled,
        ...props 
      }) => {
        const baseStyles = "inline-flex items-center justify-center px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
        
        const variants = {
          primary: "bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500 shadow-lg shadow-indigo-500/30",
          secondary: "bg-slate-700 hover:bg-slate-600 text-white focus:ring-slate-500",
          outline: "border border-slate-600 hover:border-slate-400 text-slate-300 hover:text-white focus:ring-slate-500",
          danger: "bg-red-600 hover:bg-red-700 text-white focus:ring-red-500"
        };

        return (
          <button 
            className={`${baseStyles} ${variants[variant]} ${className}`}
            disabled={disabled || isLoading}
            {...props}
          >
            {isLoading ? (
              <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            ) : icon ? (
              <span className="mr-2">{icon}</span>
            ) : null}
            {children}
          </button>
        );
      };

      // --- Components/VideoUploader.tsx ---
      const VideoUploader = ({ onVideoSelected, onError, setAppState }) => {
        const [isDragging, setIsDragging] = useState(false);
        const fileInputRef = useRef(null);

        const validateAndUpload = useCallback((file) => {
          if (!file.type.startsWith('video/')) {
            onError("Please upload a valid video file.");
            return;
          }
          setAppState(AppState.PROCESSING);
          onVideoSelected(file);
        }, [onVideoSelected, onError, setAppState]);

        const handleDrop = useCallback((e) => {
          e.preventDefault();
          setIsDragging(false);
          
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            validateAndUpload(e.dataTransfer.files[0]);
          }
        }, [validateAndUpload]);

        const handleDragOver = useCallback((e) => {
          e.preventDefault();
          setIsDragging(true);
        }, []);

        const handleDragLeave = useCallback((e) => {
          e.preventDefault();
          setIsDragging(false);
        }, []);

        const handleFileChange = useCallback((e) => {
          if (e.target.files && e.target.files[0]) {
            validateAndUpload(e.target.files[0]);
          }
        }, [validateAndUpload]);

        return (
          <div className="w-full max-w-2xl mx-auto animate-fade-in-up">
            <div 
              className={`relative border-2 border-dashed rounded-2xl p-12 transition-all duration-300 text-center ${
                isDragging 
                  ? 'border-indigo-500 bg-indigo-500/10 scale-[1.02]' 
                  : 'border-slate-700 bg-slate-800/50 hover:border-slate-500 hover:bg-slate-800'
              }`}
              onDrop={handleDrop}
              onDragOver={handleDragOver}
              onDragLeave={handleDragLeave}
            >
              <input
                type="file"
                ref={fileInputRef}
                className="hidden"
                accept="video/*"
                onChange={handleFileChange}
              />
              
              <div className="flex flex-col items-center gap-4">
                <div className={`p-4 rounded-full ${isDragging ? 'bg-indigo-500/20 text-indigo-400' : 'bg-slate-700/50 text-slate-400'}`}>
                  <Video className="w-10 h-10" />
                </div>
                
                <div className="space-y-2">
                  <h3 className="text-xl font-semibold text-white">
                    {isDragging ? 'Drop video here' : 'Upload a video'}
                  </h3>
                  <p className="text-slate-400 text-sm max-w-xs mx-auto">
                    Drag & drop or click to select a video file.
                  </p>
                </div>

                <button 
                  onClick={() => fileInputRef.current?.click()}
                  className="mt-4 px-6 py-2.5 rounded-full bg-slate-700 hover:bg-slate-600 text-white font-medium text-sm transition-colors flex items-center gap-2 group"
                >
                  <Upload className="w-4 h-4 group-hover:-translate-y-0.5 transition-transform" />
                  Select File
                </button>
              </div>
            </div>
            
            <div className="mt-6 flex items-start gap-3 p-4 rounded-lg bg-blue-500/10 border border-blue-500/20">
              <AlertCircle className="w-5 h-5 text-blue-400 shrink-0 mt-0.5" />
              <div className="space-y-1">
                <p className="text-sm font-medium text-blue-300">100% Local Processing</p>
                <p className="text-xs text-blue-400/80">
                  Video processing happens entirely in your browser. Your video files are never uploaded to any server.
                </p>
              </div>
            </div>
          </div>
        );
      };

      // --- Components/ResultDisplay.tsx ---
      const ResultDisplay = ({ videoFile, onReset }) => {
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const [videoUrl, setVideoUrl] = useState('');
        const [duration, setDuration] = useState(0);
        const [currentTime, setCurrentTime] = useState(0);
        const [dimensions, setDimensions] = useState({ width: 0, height: 0 });
        const [isLoading, setIsLoading] = useState(true);

        useEffect(() => {
          if (videoFile) {
            const url = URL.createObjectURL(videoFile);
            setVideoUrl(url);
            return () => URL.revokeObjectURL(url);
          }
        }, [videoFile]);

        const handleLoadedMetadata = () => {
          if (videoRef.current) {
            setDuration(videoRef.current.duration);
            setDimensions({
              width: videoRef.current.videoWidth,
              height: videoRef.current.videoHeight
            });
            const initialTime = Math.max(0, videoRef.current.duration - 0.1);
            videoRef.current.currentTime = initialTime;
            setCurrentTime(initialTime);
            setIsLoading(false);
          }
        };

        const drawFrame = useCallback(() => {
          if (videoRef.current && canvasRef.current) {
            const video = videoRef.current;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            
            if (ctx) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
          }
        }, []);

        const handleSeeked = () => {
          drawFrame();
        };

        const handleTimeUpdate = () => {
          if (videoRef.current) {
            setCurrentTime(videoRef.current.currentTime);
          }
        };

        const handleSeek = (time) => {
          if (videoRef.current) {
            const t = Math.max(0, Math.min(time, duration));
            videoRef.current.currentTime = t;
            setCurrentTime(t);
          }
        };

        const handleStep = (seconds) => {
          if (videoRef.current) {
            handleSeek(videoRef.current.currentTime + seconds);
          }
        };

        const handleDownload = () => {
          if (canvasRef.current) {
            const link = document.createElement('a');
            link.download = `frame-${currentTime.toFixed(2)}s.png`;
            link.href = canvasRef.current.toDataURL('image/png');
            link.click();
          }
        };

        const FRAME_STEP = 0.04; 

        return (
          <div className="w-full max-w-5xl mx-auto animate-fade-in flex flex-col h-full">
            <div className="flex items-center justify-between mb-4">
              <button 
                onClick={onReset}
                className="flex items-center text-slate-400 hover:text-white transition-colors text-sm font-medium"
              >
                <ChevronLeft className="w-4 h-4 mr-1" />
                Upload New Video
              </button>
              <div className="text-slate-500 text-xs font-mono">
                 {dimensions.width}x{dimensions.height} • {currentTime.toFixed(2)}s / {duration.toFixed(2)}s
              </div>
            </div>

            <div className="bg-black/50 rounded-2xl border border-slate-800 p-6 flex flex-col gap-6 shadow-2xl">
              
              <div className="relative aspect-video bg-black rounded-lg overflow-hidden border border-slate-800 flex items-center justify-center">
                {isLoading && (
                   <div className="absolute inset-0 flex items-center justify-center z-10 bg-slate-900">
                      <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500"></div>
                   </div>
                )}
                
                <video 
                  ref={videoRef}
                  src={videoUrl}
                  className="hidden" 
                  onLoadedMetadata={handleLoadedMetadata}
                  onSeeked={handleSeeked}
                  onTimeUpdate={handleTimeUpdate}
                  playsInline
                  muted
                />
                <canvas 
                  ref={canvasRef}
                  className="w-full h-full object-contain"
                />
              </div>

              <div className="space-y-6">
                
                <div className="relative h-6 flex items-center">
                  <input
                    type="range"
                    min="0"
                    max={duration}
                    step="0.01"
                    value={currentTime}
                    onChange={(e) => handleSeek(parseFloat(e.target.value))}
                    className="w-full absolute z-20 opacity-0 cursor-pointer h-full"
                  />
                  <div className="w-full h-2 bg-slate-700 rounded-full overflow-hidden relative z-10">
                     <div 
                       className="h-full bg-indigo-600 transition-all duration-75 ease-out"
                       style={{ width: `${(currentTime / duration) * 100}%` }}
                     />
                  </div>
                  <div 
                    className="absolute h-4 w-4 bg-white rounded-full shadow-lg border-2 border-indigo-600 z-10 pointer-events-none transition-all duration-75 ease-out"
                    style={{ left: `calc(${((currentTime / duration) * 100)}% - 8px)` }}
                  />
                </div>

                <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                  
                  <div className="flex items-center gap-2 bg-slate-800/50 p-2 rounded-xl border border-slate-700/50">
                     <button 
                       onClick={() => handleSeek(0)}
                       className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors tooltip"
                       title="Jump to Start"
                     >
                       <SkipBack className="w-5 h-5" />
                     </button>

                     <button 
                       onClick={() => handleStep(-FRAME_STEP)}
                       className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors"
                       title="Previous Frame"
                     >
                       <ChevronLeft className="w-5 h-5" />
                     </button>

                     <div className="w-px h-6 bg-slate-700 mx-1"></div>

                     <button 
                       onClick={() => handleStep(FRAME_STEP)}
                       className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors"
                       title="Next Frame"
                     >
                       <ChevronRight className="w-5 h-5" />
                     </button>

                     <button 
                       onClick={() => handleSeek(duration)}
                       className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors"
                       title="Jump to End"
                     >
                       <SkipForward className="w-5 h-5" />
                     </button>
                  </div>

                  <Button 
                    onClick={handleDownload} 
                    variant="primary" 
                    className="w-full md:w-auto min-w-[200px]"
                    icon={<Download className="w-4 h-4" />}
                  >
                    Export This Frame
                  </Button>
                </div>
              </div>

            </div>
          </div>
        );
      };

      // --- App.tsx ---
      const App = () => {
        const [appState, setAppState] = useState(AppState.IDLE);
        const [videoFile, setVideoFile] = useState(null);
        const [error, setError] = useState(null);

        const handleVideoSelected = (file) => {
          setVideoFile(file);
          setAppState(AppState.EDITOR);
          setError(null);
        };

        const handleError = (msg) => {
          setError(msg);
          setAppState(AppState.ERROR);
        };

        const handleReset = () => {
          setVideoFile(null);
          setError(null);
          setAppState(AppState.IDLE);
        };

        return (
          <div className="min-h-screen bg-[#0f172a] text-slate-100 flex flex-col">
            <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur-sm sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="bg-indigo-600 p-1.5 rounded-lg">
                    <Film className="w-5 h-5 text-white" />
                  </div>
                  <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                    EndFrame
                  </h1>
                </div>
                <div className="flex items-center gap-4">
                  <span className="text-xs font-medium px-2 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700">
                    Local Mode
                  </span>
                </div>
              </div>
            </header>

            <main className="flex-1 flex flex-col">
              <div className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 flex flex-col">
                
                {appState === AppState.IDLE || appState === AppState.PROCESSING ? (
                   <div className="flex-1 flex flex-col justify-center items-center animate-fade-in">
                      <div className="text-center mb-12 space-y-4">
                        <h2 className="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
                          Extract the <span className="text-indigo-500">Perfect Frame</span>
                        </h2>
                        <p className="text-lg text-slate-400 max-w-2xl mx-auto">
                          Upload a video to precisely select and extract high-quality frames. 
                          Works instantly in your browser, no cloud upload required.
                        </p>
                      </div>
                      
                      {appState === AppState.PROCESSING ? (
                        <div className="flex flex-col items-center justify-center p-12 space-y-4">
                          <div className="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                          <p className="text-lg font-medium text-slate-300">Loading video...</p>
                        </div>
                      ) : (
                        <VideoUploader 
                          onVideoSelected={handleVideoSelected} 
                          onError={handleError}
                          setAppState={setAppState}
                        />
                      )}
                   </div>
                ) : (
                  <ResultDisplay 
                    videoFile={videoFile} 
                    onReset={handleReset}
                  />
                )}

                {error && (
                  <div className="fixed bottom-6 right-6 max-w-md bg-red-500/10 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 animate-slide-in">
                    <span className="bg-red-500 rounded-full p-1">
                       <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                         <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                       </svg>
                    </span>
                    <p className="text-sm font-medium">{error}</p>
                    <button onClick={() => setError(null)} className="ml-auto text-red-300 hover:text-white">
                      Dismiss
                    </button>
                  </div>
                )}
              </div>
            </main>

            <footer className="border-t border-slate-800 py-6 mt-auto">
              <div className="max-w-7xl mx-auto px-4 text-center">
                <p className="text-slate-500 text-sm">
                  Powered by React & Tailwind
                </p>
              </div>
            </footer>
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
